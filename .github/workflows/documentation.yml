name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen

      - name: Configure documentation
        run: cmake -S . -B out/build/docs -DLKC_DOCUMENTATION_ONLY=ON

      - name: Build documentation
        run: cmake --build out/build/docs --target livekit_docs

      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: livekit-client-cpp-api-reference
          path: out/build/docs/api/html
          if-no-files-found: error
          retention-days: 7
